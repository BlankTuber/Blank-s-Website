<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Workbench | Blank's Workshop</title>
        <meta
            name="description"
            content="The Workbench: projects from Blank's Workshop, from websites and Discord bots to native apps and embedded work."
        />
        <link rel="canonical" href="https://blanktuber.dev/workbench/" />

        <!-- Appearance -->
        <meta name="color-scheme" content="dark light" />
        <meta
            name="theme-color"
            content="#123b35"
            media="(prefers-color-scheme: dark)"
        />
        <meta
            name="theme-color"
            content="#e0bfd5"
            media="(prefers-color-scheme: light)"
        />

        <!-- Link previews (Open Graph is also read by Discord, Slack, X, etc.) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Blank's Workshop" />
        <meta property="og:title" content="Workbench | Blank's Workshop" />
        <meta
            property="og:description"
            content="The Workbench: projects from Blank's Workshop, from websites and Discord bots to native apps and embedded work."
        />
        <meta property="og:url" content="https://blanktuber.dev/workbench/" />
        <meta
            property="og:image"
            content="https://blanktuber.dev/assets/img/og.png"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="The BLANK logo: a grey figure in headphones with black bunny ears"
        />
        <meta name="twitter:card" content="summary_large_image" />

        <!-- Icons -->
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/assets/img/logo.png" type="image/png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

        <!-- Styles -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@100..800&display=swap"
        />
        <link rel="stylesheet" href="/assets/css/global.css" />
        <link rel="stylesheet" href="/assets/css/layout.css" />
        <link rel="stylesheet" href="/assets/css/components/box.css" />
        <link rel="stylesheet" href="/assets/css/components/links.css" />
        <link rel="stylesheet" href="/assets/css/components/items.css" />
        <link rel="me" href="https://github.com/BlankTuber" />
    </head>

    <body>
        <header>
            <h1>Blank's Workshop</h1>
        </header>
        <div class="layout">
            <nav aria-label="Main">
                <div class="box compact">
                    <p class="tag" aria-hidden="true">Navigate</p>
                    <ul class="links">
                        <li><a href="/">Front Door</a></li>
                        <li>
                            <a href="/workbench/" aria-current="page"
                                >Workbench</a
                            >
                        </li>
                        <li><a href="/scratchpad/">Scratchpad</a></li>
                    </ul>
                </div>
            </nav>
            <main>
                <section class="box">
                    <h2 class="tag">Workbench</h2>
                    <p>Nothing on the bench yet.</p>
                </section>

                <!-- Project template: wrap boxes in <div class="items"> once there are several.
                <div class="items">
                    <article class="box">
                        <h2 class="tag"><a href="/workbench/project-name/">Project name</a></h2>
                        <p>One or two lines about what it is.</p>
                    </article>
                </div>
                -->
            </main>
            <aside>
                <section class="box compact">
                    <h2 class="tag">Elsewhere</h2>
                    <ul class="links">
                        <li>
                            <a href="https://github.com/BlankTuber">GitHub</a>
                        </li>
                        <li>
                            <a href="https://www.youtube.com/@BlankTuber"
                                >YouTube</a
                            >
                        </li>
                    </ul>
                </section>
            </aside>
        </div>
    </body>
</html>
