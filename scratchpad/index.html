<!doctype html>

        />

            name="theme-color"
            content="#e0bfd5"

        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="The BLANK logo: a grey figure in headphones with black bunny ears"
        />
        <meta name="twitter:card" content="summary_large_image" />

        <!-- Icons -->
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/assets/img/logo.png" type="image/png" />

    <body>
        <header>
            <h1>Blank's Workshop</h1>
        </header>
        <div class="layout">
            <nav aria-label="Main">
                <div class="box compact">

            <main>
                <section class="box">
                    <h2 class="tag">Scratchpad</h2>
                    <p>Nothing scribbled yet.</p>

                     Use a dated id; it makes the post linkable as /scratchpad/#2026-10-10-short-name
                <article class="box post" id="2026-10-10-short-name">
                    <h2 class="tag"><a href="#2026-10-10-short-name">Post title</a></h2>
                    <p class="meta"><time datetime="2026-10-10">10 October 2026</time></p>
                    <p>First paragraph.</p>
                    <p>Second paragraph.</p>
                </article>
                -->
            </main>
            <aside>
                <section class="box compact">

                            >
